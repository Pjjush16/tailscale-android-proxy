name: Build Properly Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          
      - name: Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          ls -la $HOME/.android/
          
      - name: Clean
        run: make clean
        
      - name: Build libtailscale AAR (stripped version)
        run: make libtailscale
        
      - name: Verify AAR exists
        run: |
          if [ -f "android/libs/libtailscale.aar" ]; then
            echo "✅ libtailscale.aar built successfully"
            ls -lh android/libs/libtailscale.aar
          else
            echo "❌ libtailscale.aar not found"
            exit 1
          fi
        
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          
      - name: Verify APK is signed
        run: |
          cd android
          if [ -f "build/outputs/apk/debug/android-debug.apk" ]; then
            echo "✅ APK built successfully"
            ls -lh build/outputs/apk/debug/android-debug.apk
            
            echo ""
            echo "=== Verifying APK signature ==="
            /opt/android-sdk/build-tools/34.0.0/apksigner verify --verbose build/outputs/apk/debug/android-debug.apk
            
            echo ""
            echo "=== Checking for signing files ==="
            unzip -l build/outputs/apk/debug/android-debug.apk | grep -E "META-INF/(CERT|MANIFEST)" | head -10
            
            echo ""
            echo "=== APK info ==="
            /opt/android-sdk/build-tools/34.0.0/aapt dump badging build/outputs/apk/debug/android-debug.apk | grep -E "package|sdkVersion|application-label"
          else
            echo "❌ APK not found"
            exit 1
          fi
          
      - name: Copy APK to root
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk tailscale-debug.apk
          ls -lh tailscale-debug.apk
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk
          retention-days: 30
