name: Build Signed Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore $HOME/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Clean
        run: make clean
        
      - name: Build libtailscale AAR
        run: make build-unstripped-aar
        
      - name: Build debug APK with signing
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file=$HOME/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          
      - name: Verify APK signing
        run: |
          cd android
          if [ -f "build/outputs/apk/debug/android-debug.apk" ]; then
            echo "✅ APK built successfully"
            ls -lh build/outputs/apk/debug/android-debug.apk
            /opt/android-sdk/build-tools/34.0.0/apksigner verify --verbose build/outputs/apk/debug/android-debug.apk
          else
            echo "❌ APK not found"
            exit 1
          fi
          
      - name: Copy APK to root
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk tailscale-debug.apk
          ls -lh tailscale-debug.apk
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk
          retention-days: 30
